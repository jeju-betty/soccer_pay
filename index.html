    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'travel-pay-app';
        const fbConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "AIzaSyAyQh3vCgipwKAZdPtVZRmwq3t9qapy8H0",
            authDomain: "travel-pay-69d2e.firebaseapp.com",
            projectId: "travel-pay-69d2e",
            storageBucket: "travel-pay-69d2e.firebasestorage.app",
            messagingSenderId: "822682405166",
            appId: "1:822682405166:web:82a1529a259a03761b12bf"
        };

        let db = null;
        let auth = null;
        let docRef = null;
        let unsubscribeDoc = null;

        async function connectCloud() {
            if (!fbConfig || !fbConfig.apiKey) {
                console.log("Firebase 설정이 없어 로컬 오프라인 모드로 가동됩니다.");
                return;
            }

            try {
                const app = initializeApp(fbConfig);
                auth = getAuth(app);
                db = getFirestore(app);

                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }

                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        window.firebaseConfigured = true;
                        document.getElementById('syncStatusDot').className = "w-2.5 h-2.5 rounded-full bg-emerald-500 shadow-sm animate-pulse";
                        document.getElementById('syncStatusText').innerText = "실시간 클라우드 공유 중";
                        initRoomSync();
                        // 접속 시 클라우드에 기존 생성된 전체 방 목록 자동 복구
                        window.fetchRoomsFromCloud();
                    }
                });
            } catch (e) {
                console.error("클라우드 접속 에러:", e);
                showToastAlert("클라우드 접속 실패. 로컬 모드로 작동합니다.");
            }
        }

        // 파이어베이스 클라우드 데이터베이스에서 전체 정산방 목록을 검색하여 복구 (루트 'trips' 및 artifacts 모두 탐색)
        window.fetchRoomsFromCloud = async function() {
            if (!db || !auth || !auth.currentUser) {
                showToastAlert("클라우드 연결을 확인 중입니다. 잠시 후 다시 눌러주세요.");
                return;
            }

            try {
                let querySnapshot;
                try {
                    // 사용자 파이어베이스 상의 루트 'trips' 컬렉션 우선 조회
                    const rootTripsRef = collection(db, 'trips');
                    querySnapshot = await getDocs(rootTripsRef);
                } catch(e1) {
                    const tripsCollectionRef = collection(db, 'artifacts', appId, 'public', 'data', 'trips');
                    querySnapshot = await getDocs(tripsCollectionRef);
                }
                
                let addedCount = 0;
                const rooms = window.getRecentRooms();

                querySnapshot.forEach((docSnap) => {
                    const code = docSnap.id;
                    const data = docSnap.data();
                    
                    if (code) {
                        const title = data.tripTitle || '2026 대회';
                        const existingIdx = rooms.findIndex(r => r.code === code);
                        
                        if (existingIdx === -1) {
                            rooms.push({
                                code: code,
                                title: title,
                                lastAccessed: '클라우드 동기화됨'
                            });
                            addedCount++;
                        } else {
                            rooms[existingIdx].title = title;
                        }
                    }
                });

                localStorage.setItem('travelPay_recentRoomsList', JSON.stringify(rooms));
                window.renderRecentRooms();

                if (addedCount > 0) {
                    showToastAlert(`클라우드에서 ${addedCount}개의 정산방을 불러왔습니다!`);
                } else {
                    showToastAlert("클라우드의 방 목록이 모두 동기화되어 있습니다.");
                }
            } catch (e) {
                console.error("클라우드 방 목록 복구 실패:", e);
                showToastAlert("클라우드 방 목록을 불러오는 중 오류가 발생했습니다.");
            }
        };

        function initRoomSync() {
            const hash = window.location.hash.replace('#', '').trim();
            if (!hash || !db) return;

            // 사용자 파이어베이스 구조인 루트 컬렉션 '/trips/{hash}' 우선 지정
            docRef = doc(db, 'trips', hash);

            if (unsubscribeDoc) unsubscribeDoc();
            
            unsubscribeDoc = onSnapshot(docRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    window.state.tripTitle = data.tripTitle || '2026 대회';
                    window.state.members = data.members || [...DEFAULT_MEMBERS];
                    window.state.expenses = data.expenses || [];
                    window.state.completedTransfers = data.completedTransfers || {};
                    window.state.archives = data.archives || [];
                    window.saveRecentRoom(hash, window.state.tripTitle);
                    window.render(false);
                } else {
                    // 루트 경로에 데이터가 없으면 artifacts subcollection 경로도 확인
                    const altDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'trips', hash);
                    getDoc(altDocRef).then((altSnap) => {
                        if (altSnap.exists()) {
                            docRef = altDocRef;
                            const data = altSnap.data();
                            window.state.tripTitle = data.tripTitle || '2026 대회';
                            window.state.members = data.members || [...DEFAULT_MEMBERS];
                            window.state.expenses = data.expenses || [];
                            window.state.completedTransfers = data.completedTransfers || {};
                            window.state.archives = data.archives || [];
                            window.saveRecentRoom(hash, window.state.tripTitle);
                            window.render(false);
                        } else {
                            const fallbackTitle = window.pendingTripTitle || '2026 대회';
                            window.state = {
                                tripTitle: fallbackTitle,
                                members: [...DEFAULT_MEMBERS],
                                expenses: [],
                                completedTransfers: {},
                                archives: []
                            };
                            delete window.pendingTripTitle;
                            setDoc(docRef, window.state);
                            window.saveRecentRoom(hash, window.state.tripTitle);
                            window.render(false);
                        }
                    }).catch(() => {
                        const fallbackTitle = window.pendingTripTitle || '2026 대회';
                        window.state = {
                            tripTitle: fallbackTitle,
                            members: [...DEFAULT_MEMBERS],
                            expenses: [],
                            completedTransfers: {},
                            archives: []
                        };
                        delete window.pendingTripTitle;
                        setDoc(docRef, window.state);
                        window.saveRecentRoom(hash, window.state.tripTitle);
                        window.render(false);
                    });
                }
            }, (err) => {
                console.error("실시간 공유 스냅샷 오류:", err);
            });
        }

        // 실시간 클라우드 저장
        window.saveData = async function() {
            window.state.members.sort((a, b) => a.localeCompare(b, 'ko'));
            
            // 낙관적 UI 즉시 렌더링
            window.render(false);

            if (window.roomId) {
                localStorage.setItem('travelPay_offlineBackup_' + window.roomId, JSON.stringify(window.state));
                window.saveRecentRoom(window.roomId, window.state.tripTitle);
            }

            if (window.firebaseConfigured && docRef) {
                try {
                    await setDoc(docRef, window.state);
                } catch (e) {
                    console.error("클라우드 업로드 실패:", e);
                }
            }
        };

        connectCloud();
    </script>
